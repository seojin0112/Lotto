<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로또 번호 변환기</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1c2733;
    --muted: #66727f;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --line: #dfe5ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151b;
      --card: #1a222c;
      --text: #e8edf2;
      --muted: #93a0ad;
      --accent: #5b8cff;
      --accent-text: #0d1117;
      --line: #2c3947;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  .desc { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
  }
  #seed {
    flex: 1 1 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  #seed:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #games {
    flex: 0 0 auto;
    padding: 10px 12px;
    font-size: 0.95rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  button {
    flex: 1 0 auto;
    padding: 10px 18px;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  #result { margin-top: 24px; }
  .slip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .slip .label {
    flex: 0 0 auto;
    width: 28px;
    font-weight: 800;
    color: var(--muted);
    text-align: center;
  }
  .balls { display: flex; gap: 8px; flex-wrap: wrap; }
  .ball {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.05rem;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.5, 1) both;
  }
  @keyframes pop {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .c1 { background: radial-gradient(circle at 32% 28%, #ffdb5c, #fbc400 65%); }
  .c2 { background: radial-gradient(circle at 32% 28%, #9fdcf8, #69c8f2 65%); }
  .c3 { background: radial-gradient(circle at 32% 28%, #ff9d9d, #ff7272 65%); }
  .c4 { background: radial-gradient(circle at 32% 28%, #c7c7c7, #aaaaaa 65%); }
  .c5 { background: radial-gradient(circle at 32% 28%, #cbe86e, #b0d840 65%); }
  #copy {
    margin-top: 6px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
    font-weight: 600;
  }
  #copy-status { margin-left: 10px; font-size: 0.9rem; color: var(--muted); }
  .error { color: #d64545; margin-top: 16px; }
  .note { margin-top: 28px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🎱 로또 번호 변환기</h1>
  <p class="desc">아무 문자열이나 입력하면 고유한 로또 번호로 바뀝니다. 같은 문자열은 언제 어디서 뽑아도 항상 같은 번호가 나옵니다.</p>

  <form id="form">
    <input id="seed" type="text" placeholder="예: 생년월일, 전화번호, 좋아하는 문구…" autocomplete="off" autofocus>
    <select id="games" aria-label="게임 수">
      <option value="1">1게임</option>
      <option value="2">2게임</option>
      <option value="3">3게임</option>
      <option value="4">4게임</option>
      <option value="5" selected>5게임</option>
    </select>
    <button type="submit">번호 뽑기</button>
  </form>

  <section id="result" hidden>
    <div id="slips"></div>
    <button id="copy" type="button">결과 복사</button><span id="copy-status" role="status"></span>
  </section>
  <p id="message" class="error" hidden></p>

  <p class="note">번호는 입력 문자열의 SHA-256 해시로 계산되며 무작위 추첨이 아닙니다. 재미로만 이용하세요.</p>
</main>

<script>
  const GAME_LABELS = ['A', 'B', 'C', 'D', 'E'];

  function sfc32(a, b, c, d) {
    return function () {
      a |= 0; b |= 0; c |= 0; d |= 0;
      const t = (a + b | 0) + d | 0;
      d = d + 1 | 0;
      a = b ^ b >>> 9;
      b = c + (c << 3) | 0;
      c = (c << 21 | c >>> 11);
      c = c + t | 0;
      return (t >>> 0) / 4294967296;
    };
  }

  async function gameNumbers(seedText, gameIndex) {
    // 게임마다 다른 해시가 나오도록 입력에 게임 번호를 붙임 (\0은 입력에 섞일 일이 없는 구분자)
    const data = new TextEncoder().encode(seedText + String.fromCharCode(0) + gameIndex);
    const buf = await crypto.subtle.digest('SHA-256', data);
    const v = new DataView(buf);
    // DataView 기본값(빅엔디언)으로 읽어 플랫폼 엔디언과 무관하게 동일한 시드를 보장
    const rand = sfc32(v.getUint32(0), v.getUint32(4), v.getUint32(8), v.getUint32(12));
    for (let i = 0; i < 12; i++) rand(); // sfc32 권장 워밍업: 시드가 내부 상태에 충분히 섞이도록 함
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 6).sort((a, b) => a - b);
  }

  function colorClass(n) {
    if (n <= 10) return 'c1';
    if (n <= 20) return 'c2';
    if (n <= 30) return 'c3';
    if (n <= 40) return 'c4';
    return 'c5';
  }

  const form = document.getElementById('form');
  const seedInput = document.getElementById('seed');
  const gamesSelect = document.getElementById('games');
  const result = document.getElementById('result');
  const slips = document.getElementById('slips');
  const message = document.getElementById('message');
  const copyBtn = document.getElementById('copy');
  const copyStatus = document.getElementById('copy-status');
  let lastResult = null;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    message.hidden = true;
    const seedText = seedInput.value.trim();
    if (!seedText) {
      showMessage('문자열을 입력해 주세요.');
      return;
    }
    if (!window.crypto || !crypto.subtle) {
      showMessage('이 브라우저에서는 해시 기능(SubtleCrypto)을 사용할 수 없습니다. 최신 브라우저로 열어 주세요.');
      return;
    }
    const count = Number(gamesSelect.value);
    const games = [];
    for (let i = 0; i < count; i++) {
      games.push(await gameNumbers(seedText, i));
    }
    lastResult = { seedText, games };
    render(games);
  });

  function render(games) {
    slips.innerHTML = '';
    games.forEach((numbers, gi) => {
      const slip = document.createElement('div');
      slip.className = 'slip';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = GAME_LABELS[gi];
      slip.appendChild(label);
      const balls = document.createElement('div');
      balls.className = 'balls';
      numbers.forEach((n, bi) => {
        const ball = document.createElement('span');
        ball.className = 'ball ' + colorClass(n);
        ball.textContent = n;
        ball.style.animationDelay = (gi * 6 + bi) * 40 + 'ms';
        balls.appendChild(ball);
      });
      slip.appendChild(balls);
      slips.appendChild(slip);
    });
    copyStatus.textContent = '';
    result.hidden = false;
  }

  function showMessage(text) {
    message.textContent = text;
    message.hidden = false;
    result.hidden = true;
    lastResult = null;
  }

  copyBtn.addEventListener('click', async () => {
    if (!lastResult) return;
    const lines = lastResult.games.map(
      (numbers, gi) => GAME_LABELS[gi] + ': ' + numbers.map((n) => String(n).padStart(2, '0')).join(', ')
    );
    const text = '[로또 번호 변환기] "' + lastResult.seedText + '"\n' + lines.join('\n');
    try {
      await navigator.clipboard.writeText(text);
      copyStatus.textContent = '복사되었습니다.';
    } catch {
      copyStatus.textContent = '복사에 실패했습니다. 브라우저 권한을 확인해 주세요.';
    }
  });
</script>
</body>
</html>
